name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node.js をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Lint / フォーマット検査
        run: bun run lint

      - name: 型チェック
        run: bun run check

      - name: ビルド
        run: bun run build
